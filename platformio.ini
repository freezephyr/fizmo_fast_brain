; Two environments on purpose:
;   esp32s3 builds the firmware for the board
;   native  runs logic tests on the PC, where there is no Arduino runtime
;
; src_dir stays the repo root so the Arduino IDE can still open this folder as
; a sketch. Restructuring into src/ is a separate change.

[platformio]
src_dir = .
include_dir = .

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^2.5.1
    adafruit/Adafruit PWM Servo Driver Library@^3.0.3
    adafruit/Adafruit NeoPixel@^1.15.5

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
